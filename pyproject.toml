[project]
name = "bank-guard"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "lightgbm==4.7.0",
    "matplotlib==3.10.6",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "mlflow>=3.18.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
deep = [
    "accelerate>=1.16.0",
    "tabpfn>=10.2.0",
    "torch>=2.14.1",
    "transformers>=5.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankguard"]

[tool.uv]
default-groups = ["dev", "deep"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
